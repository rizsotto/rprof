[package]
name = "rprof"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Process resource profiler — captures CPU and memory usage of a child process and renders charts in a browser."
repository = "https://github.com/rizsotto/rprof"
readme = "README.md"
keywords = ["profiler", "cpu", "memory", "proc", "cli"]
categories = ["command-line-utilities", "development-tools::profiling"]

[[bin]]
name = "rprof"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
